name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

  concurrency:
  group: hotelbooking-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            afafmahmoudnasr/hotelbooking-api:${{ github.sha }}
            afafmahmoudnasr/hotelbooking-api:latest

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name hotelbooking-api-final \
            --resource-group hotel-booking-rg \
            --image docker.io/afafmahmoudnasr/hotelbooking-api:${{ github.sha }}