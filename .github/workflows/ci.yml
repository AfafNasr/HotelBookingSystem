name: CI

on:
  push:
    branches:
      - main
      - feature/final-project

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "IntegrationTest123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'IntegrationTest123!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test
          tests/HotelBooking.UnitTests/HotelBooking.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: Run integration tests
        env:
          HOTELBOOKING_TEST_CONNECTION_STRING: >-
            Server=localhost,1433;
            User Id=sa;
            Password=IntegrationTest123!;
            Encrypt=True;
            TrustServerCertificate=True;
        run: >
          dotnet test
          tests/HotelBooking.IntegrationTests/HotelBooking.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore